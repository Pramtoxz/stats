name: Auto Commit (Natural Version)

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 * * * *" # Jalan setiap jam
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto_commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Random delay (max 10 minutes)
        run: |
          DELAY=$((RANDOM % 600))
          sleep $DELAY

      - name: Decide commit or skip (60% chance)
        run: |
          RAND=$((RANDOM % 100))
          echo "RAND=$RAND" >> $GITHUB_ENV

      - name: Update activity file
        if: env.RAND < 60
        run: |
          echo "- Update $(date '+%Y-%m-%d %H:%M:%S')" >> activity.md

      - name: Commit and push
        if: env.RAND < 60
        run: |
          git config --local user.email "pramuditometra@gmail.com"
          git config --local user.name "Pramtoxz"
          git add activity.md
          
          arr[0]="chore: update dependencies"
          arr[1]="fix: minor styling adjustments"
          arr[2]="docs: update documentation"
          arr[3]="refactor: optimize internal logic"
          arr[4]="chore: clean up temporary files"
          arr[5]="fix: patch security vulnerability"
          arr[6]="feat: minor internal update"
          arr[7]="chore: update environment variables"
          arr[8]="refactor: improve code readability"
          arr[9]="chore: maintenance update"
          
          rand=$(( RANDOM % 10 ))
          git commit -m "${arr[$rand]}"
          git push
